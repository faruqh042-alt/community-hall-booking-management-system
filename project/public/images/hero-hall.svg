<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Illustration of a bright community hall with columns, bunting and balloons">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3FF"/>
      <stop offset="0.55" stop-color="#E4DAFF"/>
      <stop offset="1" stop-color="#FFF1E8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F7FF"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7CC"/>
      <stop offset="1" stop-color="#FFE7CC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky + sun + clouds -->
  <rect width="640" height="520" fill="url(#sky)"/>
  <circle cx="520" cy="120" r="90" fill="url(#sun)"/>
  <circle cx="520" cy="120" r="34" fill="#FFD9B8"/>
  <g fill="#FFFFFF" opacity="0.92">
    <ellipse cx="110" cy="70" rx="46" ry="16"/><ellipse cx="140" cy="58" rx="30" ry="14"/><ellipse cx="82" cy="62" rx="26" ry="12"/>
    <ellipse cx="430" cy="52" rx="40" ry="13"/><ellipse cx="456" cy="42" rx="24" ry="11"/>
  </g>

  <!-- distant trees -->
  <g fill="#D1FAE5">
    <ellipse cx="60" cy="400" rx="70" ry="60"/><ellipse cx="590" cy="405" rx="80" ry="64"/>
  </g>
  <g fill="#BAF3D8">
    <ellipse cx="20" cy="420" rx="50" ry="46"/><ellipse cx="630" cy="425" rx="52" ry="48"/>
  </g>

  <!-- lawn -->
  <path d="M0 410 Q320 380 640 410 L640 520 L0 520 Z" fill="url(#lawn)"/>
  <path d="M250 520 Q320 440 390 520 Z" fill="#E0F2FE" opacity="0.9"/>

  <!-- side wings -->
  <rect x="48" y="320" width="84" height="100" rx="4" fill="url(#wall)" stroke="#E2E8F0"/>
  <rect x="508" y="320" width="84" height="100" rx="4" fill="url(#wall)" stroke="#E2E8F0"/>
  <path d="M40 322 L90 286 L140 322 Z" fill="#8B5CF6" opacity="0.9"/>
  <path d="M500 322 L550 286 L600 322 Z" fill="#8B5CF6" opacity="0.9"/>
  <rect x="72" y="344" width="36" height="50" rx="18" fill="#BFDBFE" stroke="#8B5CF6" stroke-width="3"/>
  <rect x="532" y="344" width="36" height="50" rx="18" fill="#BFDBFE" stroke="#8B5CF6" stroke-width="3"/>

  <!-- main body -->
  <rect x="130" y="232" width="380" height="188" fill="url(#wall)" stroke="#E2E8F0"/>
  <!-- pediment -->
  <polygon points="108,236 320,146 532,236" fill="url(#roof)"/>
  <polygon points="150,230 320,160 490,230" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="320" cy="205" r="17" fill="#FFFFFF"/>
  <circle cx="320" cy="205" r="10" fill="#38BDF8"/>
  <rect x="116" y="236" width="408" height="16" rx="3" fill="#DBEAFE" stroke="#BFDBFE"/>

  <!-- columns -->
  <g fill="#FFFFFF" stroke="#CBD5E1">
    <rect x="148" y="254" width="22" height="150" rx="3"/>
    <rect x="206" y="254" width="22" height="150" rx="3"/>
    <rect x="264" y="254" width="22" height="150" rx="3"/>
    <rect x="354" y="254" width="22" height="150" rx="3"/>
    <rect x="412" y="254" width="22" height="150" rx="3"/>
    <rect x="470" y="254" width="22" height="150" rx="3"/>
  </g>
  <g fill="#DBEAFE">
    <rect x="144" y="250" width="30" height="8" rx="2"/><rect x="202" y="250" width="30" height="8" rx="2"/><rect x="260" y="250" width="30" height="8" rx="2"/>
    <rect x="350" y="250" width="30" height="8" rx="2"/><rect x="408" y="250" width="30" height="8" rx="2"/><rect x="466" y="250" width="30" height="8" rx="2"/>
  </g>

  <!-- door -->
  <path d="M292 404 L292 320 Q320 280 348 320 L348 404 Z" fill="#2563EB"/>
  <path d="M302 404 L302 324 Q320 294 338 324 L338 404 Z" fill="#60A5FA" opacity="0.65"/>
  <line x1="320" y1="300" x2="320" y2="404" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="312" cy="366" r="2.5" fill="#FFF1E8"/><circle cx="328" cy="366" r="2.5" fill="#FFF1E8"/>

  <!-- steps -->
  <rect x="270" y="404" width="100" height="9" rx="2" fill="#E2E8F0"/>
  <rect x="258" y="413" width="124" height="9" rx="2" fill="#CBD5E1"/>
  <rect x="246" y="422" width="148" height="9" rx="2" fill="#B6C2D4"/>

  <!-- bunting -->
  <path d="M14 96 Q320 168 626 96" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <g>
    <polygon points="62,104 90,110 74,134" fill="#FF6B6B"/>
    <polygon points="112,114 140,121 124,146" fill="#8B5CF6"/>
    <polygon points="162,122 190,129 174,154" fill="#38BDF8"/>
    <polygon points="212,129 240,135 224,160" fill="#FFB4A2"/>
    <polygon points="262,133 290,138 274,163" fill="#2563EB"/>
    <polygon points="352,138 380,133 366,163" fill="#FF6B6B"/>
    <polygon points="402,135 430,129 416,160" fill="#8B5CF6"/>
    <polygon points="452,129 480,122 466,154" fill="#38BDF8"/>
    <polygon points="502,121 530,114 516,146" fill="#FFB4A2"/>
    <polygon points="552,112 580,104 566,134" fill="#2563EB"/>
  </g>

  <!-- balloons -->
  <g>
    <line x1="64" y1="300" x2="76" y2="396" stroke="#94A3B8"/><circle cx="64" cy="286" r="20" fill="#FF6B6B"/><circle cx="58" cy="279" r="5" fill="#FFFFFF" opacity="0.5"/>
    <line x1="92" y1="290" x2="82" y2="396" stroke="#94A3B8"/><circle cx="94" cy="276" r="18" fill="#8B5CF6"/><circle cx="88" cy="270" r="4" fill="#FFFFFF" opacity="0.5"/>
    <line x1="566" y1="300" x2="560" y2="396" stroke="#94A3B8"/><circle cx="568" cy="286" r="20" fill="#38BDF8"/><circle cx="562" cy="279" r="5" fill="#FFFFFF" opacity="0.5"/>
    <line x1="542" y1="292" x2="556" y2="396" stroke="#94A3B8"/><circle cx="540" cy="278" r="18" fill="#FFB4A2"/><circle cx="534" cy="272" r="4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- little flowers on the lawn -->
  <g>
    <circle cx="190" cy="452" r="5" fill="#FF6B6B"/><circle cx="214" cy="470" r="4" fill="#8B5CF6"/><circle cx="440" cy="458" r="5" fill="#38BDF8"/>
    <circle cx="466" cy="476" r="4" fill="#FF6B6B"/><circle cx="120" cy="480" r="4" fill="#38BDF8"/><circle cx="520" cy="488" r="5" fill="#8B5CF6"/>
  </g>
</svg>
